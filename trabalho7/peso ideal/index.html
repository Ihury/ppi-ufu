<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cálculo de Peso Ideal</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 30px; line-height: 1.6; }
        .container { max-width: 500px; border: 1px solid #ccc; padding: 20px; border-radius: 8px; background-color: #f9f9f9; }
        .campo { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input[type="text"] { width: 100%; padding: 8px; box-sizing: border-box; }
        button { background-color: #28a745; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 4px; font-size: 16px; }
        button:hover { background-color: #218838; }
        #resultado { margin-top: 20px; padding: 15px; border-left: 5px solid #28a745; background: #e9f7ef; font-size: 1.1em; }
        .instrucao { font-size: 0.9em; color: #666; margin-top: 40px; border-top: 1px dashed #ccc; padding-top: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Calculadora de Peso Ideal</h2>

        <div class="campo">
            <label for="txtAltura">Altura (em cm):</label>
            <input type="text" id="txtAltura" placeholder="Ex: 175">
        </div>

        <div class="campo">
            <label>Sexo:</label>
            <input type="radio" name="sexo" value="M" checked> Masculino
            <input type="radio" name="sexo" value="F"> Feminino
        </div>

        <button type="button" id="btnCalcular">Calcular Peso Ideal</button>

        <p id="resultado" style="display:none;"></p>
    </div>

    <div class="instrucao">
        <h3>Evidência de Depuração:</h3>
        <img src="print2.png" alt="Evidência de Depuração" style="max-width: 100%; border: 1px solid #ccc; padding: 5px; border-radius: 4px;">
        </div>

    <script>
        const btn = document.querySelector("#btnCalcular");

        btn.onclick = function() {
            const campoAltura = document.querySelector("#txtAltura");
            const altura = parseInt(campoAltura.value);

            const radioSexo = document.querySelector("input[name='sexo']:checked");
            const sexo = radioSexo.value;

            const parSaida = document.querySelector("#resultado");
            let pesoIdeal = 0;

            if (isNaN(altura)) {
                alert("Por favor, digite uma altura válida.");
                return;
            }

            if (sexo === 'M') {
                pesoIdeal = 52 + (0.75 * (altura - 152.4));
            } else {
                pesoIdeal = 52 + (0.67 * (altura - 152.4));
            }

            parSaida.style.display = "block";
            parSaida.textContent = `Para uma altura de ${altura}cm (${sexo}), seu peso ideal é: ${pesoIdeal.toFixed(2)} kg.`;
        };
    </script>
</body>
</html>
