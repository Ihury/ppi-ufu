<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro - Trabalho 4</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Formulário de Cadastro</h1>
        <form action="cadastraCliente.php" method="post" enctype="multipart/form-data">
            <input type="hidden" name="form_id" value="trabalho3">
            
            <fieldset>
                <legend>Dados Pessoais</legend>

                <div class="campo-container">
                    <label for="nome">Nome (Obrigatório):</label>
                    <input type="text" id="nome" name="nome" required autofocus minlength="2" maxlength="50" placeholder="Digite seu nome completo">
                    <span class="icone"></span>
                </div>

                <div class="campo-container">
                    <label for="email">E-mail (Obrigatório):</label>
                    <input type="email" id="email" name="email" required placeholder="exemplo@email.com">
                    <span class="icone"></span>
                </div>

                <div class="campo-container">
                    <label for="cpf">CPF:</label>
                    <input type="text" id="cpf" name="cpf" required pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" title="Formato: xxx.xxx.xxx-xx" placeholder="000.000.000-00">
                    <span class="icone"></span>
                </div>

                <div class="campo-container">
                    <label for="idade">Idade:</label>
                    <input type="number" id="idade" name="idade" required min="0" max="120">
                    <span class="icone"></span>
                </div>

                <div class="campo-container">
                    <label for="telefone">Telefone:</label>
                    <input type="tel" id="telefone" name="telefone" required placeholder="(XX) XXXXX-XXXX">
                    <span class="icone"></span>
                </div>

                <div class="campo-container">
                    <label for="nascimento">Data de Nascimento:</label>
                    <input type="date" id="nascimento" name="nascimento">
                </div>

                <div class="campo-container">
                    <span>Sexo:</span>
                    <input type="radio" id="masculino" name="sexo" value="Masculino">
                    <label for="masculino" class="label-inline">Masculino</label>
                    <input type="radio" id="feminino" name="sexo" value="Feminino">
                    <label for="feminino" class="label-inline">Feminino</label>
                </div>

                <div class="campo-container">
                    <label for="estado_civil">Estado Civil:</label>
                    <select id="estado_civil" name="estado_civil">
                        <option value="">Selecione</option>
                        <option value="solteiro">Solteiro(a)</option>
                        <option value="casado">Casado(a)</option>
                        <option value="divorciado">Divorciado(a)</option>
                    </select>
                </div>

                <div class="campo-container">
                    <label for="codigo_cliente">Código do Cliente:</label>
                    <input type="text" id="codigo_cliente" name="codigo_cliente" value="12345" readonly>
                </div>
            </fieldset>

            <fieldset>
                <legend>Endereço</legend>

                <div class="campo-container">
                    <label for="cep">CEP:</label>
                    <input type="text" id="cep" name="cep" required placeholder="00000-000">
                    <span class="icone"></span>
                </div>

                <div class="campo-container">
                    <label for="tipo_logradouro">Tipo de Logradouro:</label>
                    <select id="tipo_logradouro" name="tipo_logradouro" required>
                        <option value="">Selecione</option>
                        <option value="Rua">Rua</option>
                        <option value="Avenida">Avenida</option>
                        <option value="Praça">Praça</option>
                    </select>
                </div>

                <div class="campo-container">
                    <label for="logradouro">Logradouro:</label>
                    <input type="text" id="logradouro" name="logradouro" required>
                    <span class="icone"></span>
                </div>

                <div class="campo-container">
                    <label for="bairro">Bairro:</label>
                    <input type="text" id="bairro" name="bairro" required>
                    <span class="icone"></span>
                </div>

                <div class="campo-container">
                    <label for="cidade">Cidade:</label>
                    <input type="text" id="cidade" name="cidade" required>
                    <span class="icone"></span>
                </div>

                <div class="campo-container">
                    <label for="estado">Estado:</label>
                    <input type="text" id="estado" name="estado" required>
                    <span class="icone"></span>
                </div>
            </fieldset>

            <fieldset>
                <legend>Informações Adicionais</legend>

                <div class="campo-container">
                    <span>Interesses:</span><br>
                    <input type="checkbox" id="filmes" name="interesses[]" value="Filmes">
                    <label for="filmes" class="label-inline">Filmes</label>
                    
                    <input type="checkbox" id="informatica" name="interesses[]" value="Informática">
                    <label for="informatica" class="label-inline">Informática</label>
                    
                    <input type="checkbox" id="games" name="interesses[]" value="Games">
                    <label for="games" class="label-inline">Games</label>
                    
                    <input type="checkbox" id="livros" name="interesses[]" value="Livros">
                    <label for="livros" class="label-inline">Livros</label>
                    
                    <input type="checkbox" id="roupas" name="interesses[]" value="Roupas">
                    <label for="roupas" class="label-inline">Roupas</label>
                </div>

                <div class="campo-container">
                    <label for="info_complementar">Informações Complementares:</label>
                    <textarea id="info_complementar" name="info_complementar" rows="4" cols="50"></textarea>
                </div>

                <div class="campo-container">
                    <label for="imagem">Upload de Imagem:</label>
                    <input type="file" id="imagem" name="imagem" accept="image/*">
                </div>
            </fieldset>

            <button type="submit" class="btn-padrao">Enviar Formulário</button>
        </form>
    </main>
</body>
</html>
