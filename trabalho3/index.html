<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro</title>
</head>
<body>
    <h1>Formulário de Cadastro</h1>
    <form action="cadastraCliente.php" method="post" enctype="multipart/form-data">
        <input type="hidden" name="form_id" value="trabalho3">
        <fieldset>
            <legend>Dados Pessoais</legend>

            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" required autofocus minlength="2" maxlength="50" placeholder="Digite seu nome completo"><br><br>

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" required><br><br>

            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" name="cpf" required pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" title="Formato: xxx.xxx.xxx-xx"><br><br>

            <label for="idade">Idade:</label>
            <input type="number" id="idade" name="idade" required min="0"><br><br>

            <label for="telefone">Telefone:</label>
            <input type="tel" id="telefone" name="telefone" required><br><br>

            <label for="nascimento">Data de Nascimento:</label>
            <input type="date" id="nascimento" name="nascimento"><br><br>

            Sexo:
            <input type="radio" id="masculino" name="sexo" value="Masculino">
            <label for="masculino">Masculino</label>
            <input type="radio" id="feminino" name="sexo" value="Feminino">
            <label for="feminino">Feminino</label><br><br>

            <label for="estado_civil">Estado Civil:</label>
            <select id="estado_civil" name="estado_civil">
                <option value="">Selecione</option>
                <option value="solteiro">Solteiro(a)</option>
                <option value="casado">Casado(a)</option>
                <option value="divorciado">Divorciado(a)</option>
            </select><br><br>

            <label for="codigo_cliente">Código do Cliente:</label>
            <input type="text" id="codigo_cliente" name="codigo_cliente" value="12345" readonly><br><br>
        </fieldset>

        <!-- Endereço -->
        <fieldset>
            <legend>Endereço</legend>

            <label for="cep">CEP:</label>
            <input type="text" id="cep" name="cep" required><br><br>

            <label for="tipo_logradouro">Tipo de Logradouro:</label>
            <select id="tipo_logradouro" name="tipo_logradouro" required>
                <option value="">Selecione</option>
                <option value="Rua">Rua</option>
                <option value="Avenida">Avenida</option>
                <option value="Praça">Praça</option>
            </select><br><br>

            <label for="logradouro">Logradouro:</label>
            <input type="text" id="logradouro" name="logradouro" required><br><br>

            <label for="bairro">Bairro:</label>
            <input type="text" id="bairro" name="bairro" required><br><br>

            <label for="cidade">Cidade:</label>
            <input type="text" id="cidade" name="cidade" required><br><br>

            <label for="estado">Estado:</label>
            <input type="text" id="estado" name="estado" required><br><br>
        </fieldset>

        <!-- Informações Adicionais -->
        <fieldset>
            <legend>Informações Adicionais</legend>

            Interesses:<br>
            <input type="checkbox" id="filmes" name="interesses[]" value="Filmes">
            <label for="filmes">Filmes</label>
            <input type="checkbox" id="informatica" name="interesses[]" value="Informática">
            <label for="informatica">Informática</label>
            <input type="checkbox" id="games" name="interesses[]" value="Games">
            <label for="games">Games</label>
            <input type="checkbox" id="livros" name="interesses[]" value="Livros">
            <label for="livros">Livros</label>
            <input type="checkbox" id="roupas" name="interesses[]" value="Roupas">
            <label for="roupas">Roupas</label><br><br>

            <label for="info_complementar">Informações Complementares:</label><br>
            <textarea id="info_complementar" name="info_complementar" rows="4" cols="50"></textarea><br><br>

            <label for="imagem">Upload de Imagem:</label>
            <input type="file" id="imagem" name="imagem" accept="image/*"><br><br>
        </fieldset>

        <button type="submit">Enviar</button>
    </form>
</body>
</html>
