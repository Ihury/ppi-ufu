<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Página de cadastro de pacientes da Clínica ABC Health.">
    <title>Clínica ABC Health - Cadastro</title>
</head>
<body>

    <header>
        <h1>Clínica ABC Health</h1>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="galeria.html">Galeria</a></li>
            <li><strong>Cadastro</strong></li>
        </ul>
    </nav>

    <main>
        <section>
            <h2>Formulário de Cadastro de Paciente</h2>
            
            <form action="cadastraPaciente.php" method="POST">
                
                <p>
                    <label for="nome">Nome Completo:</label><br>
                    <input type="text" id="nome" name="nome_paciente" required>
                </p>
                
                <p>
                    <label for="cpf">CPF (apenas números):</label><br>
                    <input type="text" id="cpf" name="cpf_paciente" pattern="\d{11}" title="O CPF deve conter 11 dígitos numéricos" required>
                </p>
                
                <p>
                    <label for="telefone">Telefone:</label><br>
                    <input type="text" id="telefone" name="telefone_contato" required>
                </p>
                
                <p>
                    <label for="email">E-mail:</label><br>
                    <input type="email" id="email" name="email_contato" required>
                </p>
                
                <p>
                    <button type="submit">Cadastrar</button>
                </p>

            </form>
        </section>
    </main>

    <footer>
        <address>
            Av. João Naves de Avila, Santa Mônica, Uberlândia
        </address>
    </footer>

</body>
</html>
