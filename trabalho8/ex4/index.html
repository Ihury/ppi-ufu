<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 4 - Cadastro de Usuario</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Cadastro de Usuario</h1>

        <form id="form-cadastro" action="#" method="post" novalidate>
            <div class="campo">
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome">
                <span class="erro" id="erro-nome"></span>
            </div>

            <div class="campo">
                <label for="email">Email</label>
                <input type="email" id="email" name="email">
                <span class="erro" id="erro-email"></span>
            </div>

            <div class="campo">
                <label for="data-nascimento">Data de nascimento</label>
                <input type="date" id="data-nascimento" name="data-nascimento">
                <span class="erro" id="erro-data-nascimento"></span>
            </div>

            <div class="campo">
                <label for="telefone">Telefone</label>
                <input type="tel" id="telefone" name="telefone">
                <span class="erro" id="erro-telefone"></span>
            </div>

            <div class="campo">
                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" name="usuario">
                <span class="erro" id="erro-usuario"></span>
            </div>

            <div class="campo">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha">
                <span class="erro" id="erro-senha"></span>
            </div>

            <button type="submit">Enviar cadastro</button>
        </form>

        <p id="mensagem-sucesso"></p>
    </main>

    <script src="script.js"></script>
</body>
</html>
