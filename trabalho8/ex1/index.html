<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 1 - Lista de Interesses</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Cadastro de Interesses</h1>

        <form id="form-interesses" action="#" method="post">
            <label for="interesse">Interesse</label>
            <input type="text" id="interesse" name="interesse">
            <button type="button" id="btn-adicionar">Adicionar</button>
            <button type="button" id="btn-remover">Remover</button>
        </form>

        <p id="mensagem"></p>

        <h2>Lista ordenada</h2>
        <ol id="lista-interesses"></ol>
    </main>

    <script src="script.js"></script>
</body>
</html>
